spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:changwon_bis}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마 변경은 전부 Flyway 마이그레이션으로만 한다. JPA가 임의로 테이블을 건드리지 않게 막음.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    uri-encoding: UTF-8   # 한글 쿼리 파라미터(정류소명 등) 디코딩 깨짐 방지. 기본값 의존 금지, 명시 필요
